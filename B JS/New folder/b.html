<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body {
        background-image:url('1.jpg');

       }
       .form {
            align-items: center;
            text-align: center;
            justify-content: center;
            margin-top: 1rem;
        }
        .form input {
            border: 3px solid rgba(100, 148, 237, 0);
            transition: all;
            transition-duration: 250ms;
        }
        .img {
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        img {
            width: 150px;
            border-radius: 50%;
            border: 2px solid rgba(100, 148, 237, 0);
            transition: all;
            transition-duration: 250ms  ;
        }
        .form input:hover {
            border: 3px solid cornflowerblue;
        }
        img:hover {
            border: 2px solid cornflowerblue;
        }
    </style>
</head>
<body>
    <div class="img">
        <img src="h2h.jpg" alt="h2h">
    </div>
    <form>
        <div class="form">
        <input type="text" placeholder="Input Your Username" required>
        <br>
        <br>
        <input type="password" placeholder="Input Your Password" required>
        <br>
        <br>
        <button type="submit">Login</button>
        </div>
    </form>
</body>
</html>
