<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-image: url('k.jpg');
        background-position: 50%;
        background-repeat: no-repeat;
        background-size: cover;
        background-position-x: center;
        background-position-y: center;

      }
      .form {
        justify-content: center;
        align-items: center;
        text-align: center;
        margin-top: 1rem;
      }
      .form input {
        transition: all;
        transition-duration: 250ms;
        border: 3px solid rgba(100, 148, 237, 0);
      }
      .img {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      img {
        max-width: 100%;
        width: 20%;
        border-radius: 50%;
        border: 2px solid rgba(100, 148, 237, 0);
        transition: all;
        transition-duration: 250ms;
      }
      img:hover {
        border: 2px solid cornflowerblue;
      }
      .form input:hover {
        border: 3px solid cornflowerblue;
      }
    </style>
  </head>
  <body>
    <div class="img">
      <img src="w.jpg" alt="allets" />
    </div>
    <form class="form">
      <input type="text" placeholder="Input Your Username..." required />
      <br />
      <br />
      <input type="email" placeholder="Input Your Email..." required />
      <br />
      <br />
      <input type="password" placeholder="Input Your Password..." required />
      <br />
      <br />
      <button type="submit">Register</button>
    </form>
  </body>
</html>
